[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf-cn"
version = "1.0.0"
description = "Markdown to PDF converter with automatic Chinese font detection"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Forwindreach", url = "https://github.com/Forwindreach/volcano-agent" }
]
keywords = ["markdown", "pdf", "chinese", "cjk", "converter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "markdown-it-py>=3.0",
    "fpdf2>=2.8",
]

[project.scripts]
md2pdf = "md2pdf:main"

[project.urls]
Homepage = "https://github.com/Forwindreach/volcano-agent"
Repository = "https://github.com/Forwindreach/volcano-agent/tree/main/md2pdf"
Issues = "https://github.com/Forwindreach/volcano-agent/issues"
