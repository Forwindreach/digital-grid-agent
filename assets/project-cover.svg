<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">数字网格员 Digital Grid Agent</title>
  <desc id="desc">基于多智能体协作与 RAG 的社区治理诉求闭环系统，闽都×火山杯 Agent 创新大赛二等奖作品。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a3a"/>
      <stop offset="0.55" stop-color="#123b70"/>
      <stop offset="1" stop-color="#087f8c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="240" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1050" cy="570" r="300" fill="#2dd4bf" opacity="0.08"/>
  <path d="M0 515 C240 450 405 605 650 520 S1000 430 1200 500 V630 H0Z" fill="#020617" opacity="0.18"/>

  <g transform="translate(78 76)">
    <rect width="330" height="48" rx="24" fill="#f59e0b" opacity="0.98"/>
    <text x="165" y="32" text-anchor="middle" fill="#111827" font-size="23" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">🏆 AI 原生城市治理赛道 · 二等奖</text>
  </g>

  <g transform="translate(78 195)">
    <text x="0" y="0" fill="#ffffff" font-size="72" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">数字网格员</text>
    <text x="2" y="64" fill="#bae6fd" font-size="35" font-weight="600" letter-spacing="1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">DIGITAL GRID AGENT</text>
    <rect x="0" y="95" width="520" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="150" fill="#e0f2fe" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">多智能体协作 · 政策 RAG · 工单闭环 · 人机协同</text>
    <text x="0" y="198" fill="#94a3b8" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">HiAgent × Node.js × 微信小程序</text>
  </g>

  <g transform="translate(745 145)" filter="url(#shadow)">
    <rect width="365" height="330" rx="28" fill="#ffffff" opacity="0.96"/>
    <rect x="28" y="28" width="56" height="56" rx="16" fill="#0ea5e9"/>
    <path d="M46 57h20M56 47v20" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="105" y="64" fill="#0f172a" font-size="26" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">诉求闭环</text>
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#334155">
      <circle cx="56" cy="126" r="10" fill="#38bdf8"/><text x="82" y="133">多渠道诉求接入</text>
      <circle cx="56" cy="178" r="10" fill="#22c55e"/><text x="82" y="185">意图识别与上下文补全</text>
      <circle cx="56" cy="230" r="10" fill="#a78bfa"/><text x="82" y="237">21 篇政策检索与溯源</text>
      <circle cx="56" cy="282" r="10" fill="#f59e0b"/><text x="82" y="289">自动派单与人工确认</text>
    </g>
  </g>

  <text x="78" y="580" fill="#cbd5e1" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">闽都×火山杯 Agent 创新大赛 · 2026</text>
</svg>
